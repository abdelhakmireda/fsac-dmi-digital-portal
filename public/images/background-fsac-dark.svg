<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" style="display:block;width:100%;height:100%;max-width:none">
  <title id="title">FSAC DMI — fond académique numérique vectoriel clair</title>
  <desc id="desc">Bâtiment FSAC moderne avec mathématiques, informatique, algorithmes et circuits, entièrement dessiné en SVG.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081722"/><stop offset="1" stop-color="#06131e"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#17364b" stop-opacity=".58"/><stop offset="1" stop-color="#0a1c29" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17364b" stop-opacity=".34"/><stop offset="1" stop-color="#d8e8f1" stop-opacity=".08"/></linearGradient>
    <pattern id="dots" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#3789b8" opacity=".58"/></pattern>
    <pattern id="mesh" width="24" height="21" patternUnits="userSpaceOnUse"><path d="M0 10.5 6 0h12l6 10.5L18 21H6Z" fill="none" stroke="#557d94" stroke-width=".7" opacity=".6"/><path d="M6 0 18 21M18 0 6 21" stroke="#60869c" stroke-width=".45"/></pattern>
    <pattern id="arabesque" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M11 0 22 11 11 22 0 11ZM11 4 18 11 11 18 4 11Z" fill="none" stroke="#567f98" stroke-width=".65"/><circle cx="11" cy="11" r="2.7" fill="none" stroke="#6d91a6" stroke-width=".55"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4380a3"/></marker>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <g id="win" fill="url(#glass)" stroke="#567f98" stroke-width=".8"><rect width="35" height="39"/><path d="M17.5 0v39M0 19.5h35" opacity=".62"/></g>
    <g id="palm" fill="none" stroke="#527d96" stroke-linecap="round"><path d="M0 140C4 106 4 68 0 26" stroke-width="1.7"/><path d="M0 28C-24 7-51 6-72 18M0 28C-22-1-42-10-60-6M0 28C-6-3 0-22 10-38M0 28C20-2 43-13 63-8M0 28C27 11 54 13 73 27M0 28C-29 24-51 35-66 51M0 28C23 27 45 39 60 57" stroke-width="1.1"/></g>
    <g id="shrub" fill="none" stroke="#527c95" stroke-width=".8"><path d="M0 25C4 6 17-3 29 8 35-6 51-4 55 11 69 7 79 18 75 30H0Z"/><path d="M11 24c2-8 7-12 14-16m8 17c1-8 6-14 13-19m10 21c2-7 7-11 12-13"/></g>
    <g id="smallNode"><circle r="3" fill="#56b4df" filter="url(#glow)"/><circle r="1" fill="#fff"/></g>
    <style>
      #building-lines{animation:buildingDrift 13s ease-in-out infinite;transform-origin:960px 690px}
      #fsac-sign{stroke:#7692aa;stroke-width:.65;paint-order:stroke fill;stroke-dasharray:230;animation:writeFsac 3.2s ease-in-out infinite}
      @keyframes buildingDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(1.5px,-2px)}}
      @keyframes writeFsac{0%{stroke-dashoffset:230;fill-opacity:.18}38%,72%{stroke-dashoffset:0;fill-opacity:1}100%{stroke-dashoffset:-230;fill-opacity:.18}}
      @media(prefers-reduced-motion:reduce){#building-lines,#fsac-sign{animation:none}}
    </style>
  </defs>

