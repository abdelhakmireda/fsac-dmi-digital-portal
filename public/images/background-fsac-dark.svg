  <!-- MATHÉMATIQUES À GAUCHE -->
  <g fill="#5e8097" font-family="Georgia,'Times New Roman',serif" font-style="italic" opacity=".74">
    <text x="95" y="240" font-size="20">f(x) = ∫ₐˣ f(t)dt</text>
    <text x="95" y="297" font-size="20">d/dx f(x) = limₕ→₀ [f(x+h)−f(x)] / h</text>
    <text x="95" y="357" font-size="20">∇f(u,v,w) = (∂f/∂x, ∂f/∂y, ∂f/∂z)</text>
    <text x="95" y="417" font-size="20">∇²u = ∂²u/∂x² + ∂²u/∂y² + ∂²u/∂z²</text>
    <text x="225" y="491" font-size="18">sin² θ + cos² θ = 1</text><text x="225" y="529" font-size="18">eⁱᶿ = cos θ + i sin θ</text>
    <text x="290" y="589" font-size="22">∑ⁿₖ₌₀ k = n(n+1)/2</text>
    <text x="92" y="680" font-size="19">A = [ a₁₁  a₁₂  ⋯  a₁ₙ ]   Ax = b</text>
    <text x="92" y="781" font-size="19">det(A) = | a₁₁  a₁₂  ⋯  a₁ₙ |</text>
    <text x="92" y="856" font-size="20">P(A∪B) = P(A) + P(B) − P(A∩B)</text>
    <text x="92" y="902" font-size="20">P(A|B) = P(A∩B) / P(B)</text>
  </g>
