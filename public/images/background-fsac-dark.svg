  <g fill="#62849a" font-family="Arial,sans-serif" font-size="13" text-anchor="middle"><text x="1449" y="206">START</text><text x="1449" y="259">INPUT</text><text x="1449" y="324">VALID ?</text><text x="1449" y="410">PROCESS</text><text x="1449" y="475">DONE ?</text><text x="1452" y="558">END</text><text x="1708" y="219">1</text><text x="1656" y="280">2</text><text x="1760" y="280">3</text><text x="1625" y="341">4</text><text x="1687" y="341">5</text><text x="1729" y="341">6</text><text x="1791" y="341">7</text></g>
  <g fill="#5e7e94" font-family="Consolas,'Courier New',monospace" font-size="12.5" opacity=".85">
    <text x="1594" y="382">Algorithm Factoriel(n)</text><text x="1594" y="402">Input: n ∈ N</text><text x="1594" y="422">Output: n!</text><text x="1594" y="442">fact ← 1</text><text x="1594" y="462">for i ← 2 to n do</text><text x="1594" y="482">  fact ← fact × i</text><text x="1594" y="502">end for</text><text x="1594" y="522">return fact</text><text x="1594" y="560">Search: O(n)</text><text x="1594" y="580">Sort: O(n log n)</text><text x="1594" y="600">Space: O(n)</text>
  </g>

