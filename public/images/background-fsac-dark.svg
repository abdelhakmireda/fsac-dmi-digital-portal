  <!-- FENÊTRE DE CODE -->
  <g transform="translate(1495 620)">
    <rect width="334" height="220" rx="10" fill="#0b1d2a" fill-opacity=".42" stroke="#5b849c" stroke-width="1"/>
    <path d="M0 28h334" stroke="#5b849c" stroke-width=".8"/><circle cx="15" cy="14" r="4" fill="#6d91a6"/><circle cx="28" cy="14" r="4" fill="#7198ad"/><circle cx="41" cy="14" r="4" fill="#89a9ba"/>
    <g fill="#608299" font-family="Consolas,'Courier New',monospace" font-size="11.5"><text x="12" y="52">01  def fibonacci_recursive(n):</text><text x="12" y="72">02      if n &lt;= 1:</text><text x="12" y="92">03          return n</text><text x="12" y="112">04      else:</text><text x="12" y="132">05          return fibonacci_recursive(n-1) +</text><text x="12" y="152">06                 fibonacci_recursive(n-2)</text><text x="12" y="182">08  n = int(input(&quot;n = &quot;))</text><text x="12" y="202">09  for i in range(n + 1): print(i)</text></g>
  </g>

